<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Dark rounded tile (reads well in Chrome light/dark tabs) -->
  <rect width="32" height="32" rx="7" fill="#07080c"/>
  <!-- Same half-moon as the site brand mark, rotated ~15° like the nav logo -->
  <g transform="rotate(15 16 16)">
    <circle cx="16" cy="16" r="11" fill="rgba(125,211,252,0.12)"/>
    <defs>
      <radialGradient id="moon" cx="62%" cy="38%" r="70%">
        <stop offset="0%" stop-color="#f4f7fb"/>
        <stop offset="55%" stop-color="#d8e0ea"/>
        <stop offset="100%" stop-color="#a8b4c4"/>
      </radialGradient>
    </defs>
    <!-- Right half-moon (lit) -->
    <path d="M 16 5.5 A 10.5 10.5 0 0 1 16 26.5 Z" fill="url(#moon)"/>
    <!-- Subtle craters -->
    <circle cx="21" cy="12.5" r="1.35" fill="rgba(80,100,120,0.22)"/>
    <circle cx="23.2" cy="17.5" r="0.95" fill="rgba(80,100,120,0.2)"/>
    <circle cx="19.5" cy="20.5" r="0.75" fill="rgba(80,100,120,0.18)"/>
  </g>
</svg>
